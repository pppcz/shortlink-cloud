# =====================================================================
# 前端 Nginx 配置
#   * SPA history 路由回退到 index.html
#   * /api 反向代理到后端容器
#   * 静态资源长缓存（文件名带 hash）
# =====================================================================

upstream shortlink_backend {
    # 后端容器名由 docker-compose 网络解析
    server backend:8080;
    keepalive 64;
}

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 2m;

    # 访问日志：记录真实客户端 IP（配合后端 IpUtils 解析 X-Forwarded-For）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---------------- 健康检查 ----------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass         http://shortlink_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 限流相关响应头要透传给前端，否则前端读不到剩余配额
        proxy_pass_header  X-RateLimit-Limit;
        proxy_pass_header  X-RateLimit-Remaining;
        proxy_pass_header  Retry-After;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Swagger / OpenAPI：方便从宿主机直接访问
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass         http://shortlink_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass         http://shortlink_backend;
        proxy_set_header   Host $host;
        # 生产环境不建议把 actuator 暴露到公网，这里限制来源
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny  all;
    }

    # ---------------- 静态资源 ----------------
    # Vite 产物文件名带内容 hash，可以放心长缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
        expires 7d;
        access_log off;
    }

    # ---------------- SPA 入口 ----------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        # history 模式下所有未匹配路径都交给前端路由
        try_files $uri $uri/ /index.html;
        # index.html 绝不缓存，否则前端发版后用户拿到旧壳子
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
