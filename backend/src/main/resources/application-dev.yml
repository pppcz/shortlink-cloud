# =====================================================================
# 开发环境 profile
# =====================================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shortlink}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: true

redisson:
  enabled: true

shortlink:
  domain: ${SHORTLINK_DOMAIN:http://localhost:8080}

logging:
  level:
    com.shortlink.cloud: DEBUG
    org.springframework.amqp: INFO
    com.baomidou.mybatisplus: INFO

springdoc:
  swagger-ui:
    enabled: true
